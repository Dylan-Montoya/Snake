<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake 🐍</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1e1e2e;
    font-family: monospace;
    color: #cdd6f4;
    padding: 20px;
  }
  h1 {
    margin: 0 0 16px;
    font-size: 26px;
    color: #a6e3a1;
  }
  canvas {
    background: #11111b;
    border: 3px solid #89b4fa;
    border-radius: 8px;
    display: block;
    max-width: 100%;
    height: auto;
  }
  #score {
    margin-top: 14px;
    font-size: 20px;
    color: #f9e2af;
  }
  #msg {
    margin-top: 8px;
    font-size: 14px;
    color: #f38ba8;
    min-height: 20px;
    text-align: center;
  }
  #controls {
    margin-top: 10px;
    font-size: 13px;
    color: #9399b2;
    text-align: center;
  }
</style>
</head>
<body>

<h1>🐍 Snake</h1>
<canvas id="game" width="400" height="400"></canvas>
<div id="score">Puntos: 0</div>
<div id="msg">Flechas o WASD para mover · Espacio para reiniciar</div>
<div id="controls">Haz clic en la página si el teclado no responde</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const msgEl = document.getElementById('msg');

const GRID = 20;
const COLS = canvas.width / GRID;
const ROWS = canvas.height / GRID;

let snake, dir, nextDir, food, score, timer, speed, gameOver;

function init() {
  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  speed = 130;
  gameOver = false;
  scoreEl.textContent = 'Puntos: 0';
  msgEl.textContent = 'Flechas o WASD para mover · Espacio para reiniciar';
  placeFood();
  clearInterval(timer);
  timer = setInterval(loop, speed);
  draw();
}

function placeFood() {
  do {
    food = {
      x: Math.floor(Math.random() * COLS),
      y: Math.floor(Math.random() * ROWS)
    };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function loop() {
  if (gameOver) return;

  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // choque con paredes
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    return endGame();
  }
  // choque consigo misma
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    return endGame();
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = 'Puntos: ' + score;
    placeFood();
    if (speed > 60) {
      speed -= 3;
      clearInterval(timer);
      timer = setInterval(loop, speed);
    }
  } else {
    snake.pop();
  }

  draw();
}

function endGame() {
  gameOver = true;
  clearInterval(timer);
  msgEl.textContent = '💀 Game Over — Puntos: ' + score + ' · Espacio para reiniciar';
}

function draw() {
  // fondo
  ctx.fillStyle = '#11111b';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // cuadrícula
  ctx.strokeStyle = '#1e1e2e';
  ctx.lineWidth = 1;
  for (let i = 1; i < COLS; i++) {
    ctx.beginPath();
    ctx.moveTo(i * GRID, 0);
    ctx.lineTo(i * GRID, canvas.height);
    ctx.stroke();
  }
  for (let j = 1; j < ROWS; j++) {
    ctx.beginPath();
    ctx.moveTo(0, j * GRID);
    ctx.lineTo(canvas.width, j * GRID);
    ctx.stroke();
  }

  // comida
  ctx.fillStyle = '#f38ba8';
  ctx.beginPath();
  ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 2, 0, Math.PI * 2);
  ctx.fill();

  // serpiente
  snake.forEach((seg, i) => {
    ctx.fillStyle = i === 0 ? '#a6e3a1' : '#89b4fa';
    ctx.fillRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2);
  });

  // ojos en la cabeza
  const head = snake[0];
  ctx.fillStyle = '#11111b';
  const cx = head.x * GRID + GRID / 2;
  const cy = head.y * GRID + GRID / 2;
  ctx.beginPath();
  ctx.arc(cx - 3, cy - 3, 1.5, 0, Math.PI * 2);
  ctx.arc(cx + 3, cy - 3, 1.5, 0, Math.PI * 2);
  ctx.fill();
}

function onKey(e) {
  const k = e.key.toLowerCase();

  const map = {
    arrowup: {x: 0, y: -1},    w: {x: 0, y: -1},
    arrowdown: {x: 0, y: 1},   s: {x: 0, y: 1},
    arrowleft: {x: -1, y: 0},  a: {x: -1, y: 0},
    arrowright: {x: 1, y: 0},  d: {x: 1, y: 0}
  };

  const nd = map[k];
  if (nd) {
    e.preventDefault();
    if (nd.x !== -dir.x || nd.y !== -dir.y) nextDir = nd;
  }

  if (e.code === 'Space') {
    e.preventDefault();
    init();
  }
}

window.addEventListener('keydown', onKey, { capture: true });

// foco al hacer clic (por si el navegador se queda en la barra)
document.addEventListener('mousedown', () => window.focus());

init();
</script>

</body>
</html>
